<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Stallion Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Flat stationery look: warm paper, black 2px rules, pastel colour blocks (one per colt), light big type, bold spaced labels. One committed light look. */
:root{
  --bg:#F3F2EE; --surface:#FBFAF6; --field:#FFFFFF; --ink:#141413; --muted:#5D5D57; --soft:#E7E5DE; --focus:#3A6FD8;
  --sky:#A9C6EC; --sky-t:#DCE7F7; --lilac:#BDB7E6; --lilac-t:#E3E0F5; --sage:#A9CEB6; --sage-t:#DAEBDF;
  --lemon:#F1E27A; --lemon-t:#F8F1C2; --peach:#F5B98E; --peach-t:#FBE2CF; --rose:#EFB8C8; --rose-t:#F9E3EA;
  --good:#1F6B47; --warn:#8A4B0B;
  --stage:var(--sky); --stage-t:var(--sky-t);
  --font:"Hanken Grotesk",Helvetica,Arial,sans-serif; --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-weight:400}
h1,h2{font-weight:400;letter-spacing:-.03em;line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,6.5vw,4.4rem)}
h2{font-size:clamp(1.6rem,3.6vw,2.4rem)}
h3{margin:0;font-size:.95rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.25}
p{margin:0}
.band{padding-block:22px;padding-inline:max(16px,calc((100% - 1120px)/2))}
.band.tight{padding-block:12px}
.band.head{padding-block:20px 8px}
.headbox{background:var(--stage);border:2px solid var(--ink);border-radius:var(--r);padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.headbox h3{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:400;letter-spacing:-.02em;text-transform:none;margin-top:4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.small{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;color:var(--ink);min-width:0}
.card.blue{background:var(--c,var(--sky));}
.card.coral{background:var(--lemon);border-width:3px}
.card.pick{cursor:pointer}
.card.pick:hover{background:var(--field)}
.card.on{border-width:3px;background:var(--c-t,var(--sky-t))}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.card.blue .eyebrow,.card.coral .eyebrow,.headbox .eyebrow{color:var(--ink)}
.lead{font-size:1.1rem;max-width:62ch}
.muted{color:var(--muted)}
.card.blue .muted,.card.coral .muted{color:#2E2E2B}
.small{font-size:.88rem}
.num{font-weight:400;letter-spacing:-.04em;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.btn{font:700 .95rem var(--font);border:2px solid var(--ink);border-radius:10px;padding:10px 18px;min-height:44px;background:var(--ink);color:var(--surface);cursor:pointer}
.btn:hover{background:#2C2C2A} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.blue{background:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.ghost:hover{background:var(--field)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.84rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card.pick:focus-visible,.opt:focus-within{outline:3px solid var(--focus);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label input,label select,label textarea{text-transform:none;letter-spacing:0}
input,select,textarea{font:400 1.05rem var(--font);color:var(--ink);background:var(--field);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--ink)}
textarea{min-height:112px;resize:vertical;line-height:1.55;overflow-y:hidden}
.writing textarea{font-size:1.1rem;padding:14px 16px;min-height:132px}
.writing{max-width:900px}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:2px 9px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--ink)}
.tag.real{background:var(--sky-t)} .tag.game{background:var(--peach-t)} .tag.ok{background:var(--sage)} .tag.wait{background:var(--lemon-t)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months span{padding:5px 10px;border:2px solid var(--ink);border-radius:8px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface)}
.months span.now{background:var(--ink);color:var(--surface)}
.months span.done{background:transparent;opacity:.55;text-decoration:line-through}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
thead th{border-bottom:2px solid var(--ink)}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.bar{height:16px;border:2px solid var(--ink);border-radius:6px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky)}
.bar.coral i{background:var(--peach)}
.step{display:inline-flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-size:1.1rem;font-weight:700;cursor:pointer}
.step button:hover{background:var(--field)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:500}
.opt.on{border-width:3px;padding:11px 13px;background:var(--sky-t)}
.lv{display:flex;gap:6px;flex-wrap:wrap}
.lv button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;min-height:36px;font:700 .78rem var(--font);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.lv button.on{background:var(--ink);color:var(--surface)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.plain li{padding-left:18px;position:relative}
ul.plain li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--stage)}
ul.plain li.up::before{background:var(--sage)}
details summary{cursor:pointer;font-weight:700}
.preview{background:var(--ink);color:var(--surface);padding:8px max(16px,calc((100% - 1120px)/2));font-size:.86rem}
.preview select{width:auto;min-height:0;padding:5px 10px;border-color:var(--surface);font-size:.86rem}
.gate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:1000px}
@media (min-width:560px){.gate{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.gate{grid-template-columns:repeat(6,minmax(0,1fr))}}
.gate div{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;text-align:left}
.gate b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.gate span{display:block;font-size:1.35rem;letter-spacing:-.02em;margin-top:2px}
@media (prefers-reduced-motion:no-preference){.card.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}}
</style>

<script>/* The Stallion Game scoring engine. Pure functions; runs in Node, Deno and the browser. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.StallionEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var LEVELS = { weak: 0.70, solid: 0.90, strong: 1.05, outstanding: 1.15 };
  var LEVEL_NAMES = { weak: 'Weak', solid: 'Solid', strong: 'Strong', outstanding: 'Outstanding' };
  var EV_Q = { weak: 0.30, solid: 0.60, strong: 0.85, outstanding: 1.0 };
  var CAP = 200, MAX_RIGHTS = 30, RIGHT_MULT = 2.5;
  var H2H_LOSS = 0.02, REF = 130, RESEARCH_F = { weak: 0.85, solid: 0.93, strong: 0.98, outstanding: 1 }, PITCH_F = { weak: 0.88, solid: 0.95, strong: 0.99, outstanding: 1 };
  var W_BASE = 65, W_LAUNCH = 45, W_EVENTS = 12, W_SALES = 8;
  var STATES = ['NSW', 'VIC', 'QLD', 'WA'];
  var GROUPS = ['Large commercial farms', 'Mid-size commercial breeders', 'Farm clients and shareholders',
    'Breed-to-race owner-breeders', 'Small breeders with one or two mares', 'Interstate and New Zealand breeders'];

  var EVENTS = [];

  var D = null, byColt = {}, byFarm = {}, byMenu = {};
  function init(data) {
    D = data; byColt = {}; byFarm = {}; byMenu = {};
    EVENTS = data.events || []; API.EVENTS = EVENTS;
    data.colts.forEach(function (c) { byColt[c.id] = c; });
    data.farms.forEach(function (f) { byFarm[f.name] = f; });
    data.menu.forEach(function (m) { byMenu[m.id] = m; });
  }

  /* small seeded generator so results repeat */
  function rng(seed) {
    var s = 0, str = String(seed);
    for (var i = 0; i < str.length; i++) s = (Math.imul(s ^ str.charCodeAt(i), 2654435761) + 0x9e3779b9) | 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function pFromBookings(b) { return clamp((b - 52) / 78, 0.2, 1); }

  /* where the colt stands: strength of the placement and the fee that suits it */
  function placement(colt, farmName) {
    var A = colt.A, f = byFarm[farmName];
    if (!f) return { P: 0.3, fstar: A.fee, lo: A.lo, hi: A.hi, kind: 'other', state: A.state };
    if (farmName === A.farm) return { P: 1, fstar: A.fee, lo: A.lo, hi: A.hi, kind: 'A', state: f.state };
    if (farmName === colt.B.farm) {
      var k = colt.B.fee / A.fee;
      return { P: pFromBookings(colt.B.bookings), fstar: colt.B.fee, lo: Math.round(A.lo * k), hi: Math.round(A.hi * k), kind: 'B', state: f.state };
    }
    var wins = [colt.WA, colt.QLD];
    for (var i = 0; i < wins.length; i++) {
      var w = wins[i];
      if (w && w.farm === farmName) return { P: pFromBookings(w.bookings), fstar: Math.round((w.lo + w.hi) / 2), lo: w.lo, hi: w.hi, kind: 'window', state: f.state };
    }
    var aff = f.state === A.state ? 1 : f.state === colt.B.state ? 0.85 :
      ((f.state === 'WA' && colt.WA) || (f.state === 'QLD' && colt.QLD)) ? 0.8 :
      (f.state === 'NSW' || f.state === 'VIC') ? 0.6 : 0.35;
    var band = A.fee > f.max ? f.max / A.fee : A.fee < f.min * 0.8 ? A.fee / (f.min * 0.8) : 1;
    var crowd = 0;
    f.roster.forEach(function (r) { if (r.fee && Math.abs(r.fee - A.fee) / A.fee <= 0.3) crowd++; });
    var fit = clamp(0.4 * aff + 0.3 * f.reach + 0.3 * band - Math.min(0.12, 0.03 * crowd), 0, 1);
    var regional = (f.state === 'QLD' || f.state === 'WA') && (A.state === 'NSW' || A.state === 'VIC');
    var k2 = regional ? 0.85 : 1;
    return { P: 0.30 + 0.32 * fit, fstar: Math.round(A.fee * k2), lo: Math.round(A.lo * k2), hi: Math.round(A.hi * k2), kind: 'other', state: f.state, crowd: crowd };
  }

  /* how demand responds to the fee: revenue peaks at the fee that suits the placement */
  function feeDemand(fee, pl) {
    if (fee <= pl.fstar) return Math.pow(pl.fstar / Math.max(fee, pl.lo), 0.5);
    if (fee <= pl.hi) return Math.pow(pl.fstar / fee, 1.8);
    return Math.pow(pl.fstar / pl.hi, 1.8) * Math.pow(pl.hi / fee, 4);
  }

  function cost(buys) {
    var c = 0;
    for (var k in buys) if (byMenu[k]) c += byMenu[k].price * (buys[k] || 0);
    return c;
  }
  function addBuys(a, b) {
    var o = {}, k;
    for (k in a) o[k] = (o[k] || 0) + (a[k] || 0);
    for (k in b) o[k] = (o[k] || 0) + (b[k] || 0);
    return o;
  }
  /* marketing points for a set of purchases */
  function points(colt, buys) {
    var S = 0, shoot = (buys.shoot || 0) > 0, data = (buys.data || 0) > 0;
    D.menu.forEach(function (m) {
      var q = buys[m.id] || 0; if (!q) return;
      var match = colt.buys[m.id] ? 1 : 0.35, syn = 1;
      if (shoot && (m.id === 'parade' || m.id === 'video' || m.id === 'pages' || m.id === 'social')) syn *= 1.3;
      if (m.id === 'video' && !shoot) syn *= 0.25;
      if (data && (m.id === 'email' || m.id === 'insp')) syn *= 1.25;
      var rep = 0; for (var i = 0; i < q; i++) rep += Math.pow(0.6, i);
      S += m.v * match * syn * rep;
    });
    return S;
  }
  function mixScore(colt, S) {
    var Sb = points(colt, colt.buys), tau = Sb / 1.6;
    return Math.min(1, (1 - Math.exp(-S / tau)) / (1 - Math.exp(-Sb / tau)));
  }
  function targetFit(colt, targets) {
    var w = [0.5, 0.3, 0.2], score = 0;
    colt.groups.forEach(function (g, i) {
      var j = (targets || []).indexOf(g);
      if (j === i) score += w[i]; else if (j >= 0) score += 0.7 * w[i];
    });
    return 0.55 + 0.45 * score;
  }
  function geoBench(colt, pl) {
    if (pl.state === colt.A.state) return colt.geo;
    var rest = 0, g = {};
    STATES.forEach(function (s) { if (s !== pl.state) rest += colt.geo[s] || 0; });
    STATES.forEach(function (s) { g[s] = s === pl.state ? 0.65 : (rest > 0 ? 0.35 * (colt.geo[s] || 0) / rest : 0.35 / 3); });
    return g;
  }
  function geoFit(colt, pl, geo) {
    var b = geoBench(colt, pl), l1 = 0, tot = 0;
    STATES.forEach(function (s) { tot += (geo && geo[s]) || 0; });
    STATES.forEach(function (s) { l1 += Math.abs(((geo && geo[s]) || 0) / (tot || 1) - b[s]); });
    return 1 - 0.5 * (l1 / 2);
  }
  function benchBook(c) { return (c && c.A && c.A.book) || REF; }
  function salesCurve(x) { return 1 - Math.exp(-Math.max(0, x) / 9000); }
  function rightsCostCurve(nStar, n) {
    var c = 0; for (var i = 1; i <= n; i++) c += Math.max(0, 1.5 + 0.10 * (i - nStar));
    return c;
  }
  function eventFor(seed, round) {
    var pool = EVENTS.filter(function (e) { return e.round === round; });
    return pool[Math.floor(rng(seed + ':event:' + round)() * pool.length)];
  }

  /*
   * decisions: { farm, fee, rights, targets[3], geo{}, buys{}, r1:{resp,buys}, r2:{resp,buys,fee}, r3:{resp,buys} }
   * levels: { launch, oct }   stage: 'sep' | 'oct' | 'final'   opts: { seed, noise }
   */
  function evaluate(coltId, dec, levels, opts) {
    opts = opts || {};
    var colt = byColt[coltId], pl = placement(colt, dec.farm);
    var fee1 = Math.max(1000, Number(dec.fee) || pl.fstar);
    var L = LEVELS[(levels && levels.launch) || 'solid'];
    var O = LEVELS[(levels && levels.oct) || (levels && levels.launch) || 'solid'];
    var msgF = (0.7 * L + 0.3 * O) / LEVELS.outstanding, msgLaunch = L / LEVELS.outstanding;
    var tf = targetFit(colt, dec.targets), gf = geoFit(colt, pl, dec.geo);
    var BK = benchBook(colt), K = BK / REF;
    var h2h = 1 - H2H_LOSS * Math.max(0, Math.min(6, Number(levels && levels.h2hLost) || 0));
    var prep = RESEARCH_F[(levels && levels.research) || 'solid'] * PITCH_F[(levels && levels.pitch) || 'solid'];
    var mk = 0.8 + 0.2 * pl.P;

    var launchBuys = dec.buys || {};
    var rounds = [dec.r1 || {}, dec.r2 || {}, dec.r3 || {}];
    var lateBuys = {}, eventCost = 0, qs = [], discounts = [], evs = [];
    var seed = opts.seed || 'x';
    rounds.forEach(function (r, i) {
      lateBuys = addBuys(lateBuys, r.buys || {});
      var ev = (opts.events && opts.events[i]) || eventFor(seed, i + 1), answered = !!(r.text && String(r.text).trim()) || r.level;
      var lv = answered ? (r.level || 'solid') : null, q = lv ? EV_Q[lv] : 0.15;
      var c = Math.max(0, Number(r.cost) || 0), dp = clamp(Number(r.disc) || 0, 0, 50) / 100, dm = clamp(Math.round(Number(r.mares) || 0), 0, CAP);
      qs.push(q); eventCost += c; evs.push({ event: ev, level: lv, judged: !!r.level, text: r.text || '', cost: c, disc: dp, mares: dm });
      if (dp > 0 && dm > 0) discounts.push({ d: dp, mares: dm });
    });
    var Sl = points(colt, launchBuys), Sall = points(colt, addBuys(launchBuys, lateBuys));
    var mixL = mixScore(colt, Sl), mixAll = mixScore(colt, Sl + 0.7 * Math.max(0, Sall - Sl));
    var spent = cost(launchBuys) + cost(lateBuys) + eventCost;
    var left = Math.max(0, D.budget - spent);
    var benchLeft = D.budget - cost(colt.buys);

    var base = K * W_BASE * pl.P * prep;
    var launch = K * W_LAUNCH * msgLaunch * tf * gf * mixL * mk * prep;
    var late = K * W_LAUNCH * msgF * tf * gf * (mixAll - mixL) * mk + K * W_LAUNCH * (msgF - msgLaunch) * tf * gf * mixL * mk * 0.5;
    var evPart = function (i) { return K * (W_EVENTS / 3) * qs[i] * mk; };
    var sales = K * W_SALES * Math.min(1, salesCurve(left) / salesCurve(benchLeft)) * mk;

    var d1 = feeDemand(fee1, pl);
    var sepBook = Math.min(CAP, 0.60 * (base + launch) * d1);
    var rawOct = 0.85 * (base + launch) + evPart(0);
    var octBook = Math.min(CAP, Math.max(sepBook, rawOct * d1));
    var rawAll = base + launch + late + evPart(0) + evPart(1) + evPart(2) + sales;

    var fee2 = Number(rounds[1].fee) || fee1, changed = fee2 !== fee1, cut = fee2 < fee1;
    var d2 = feeDemand(fee2, pl);
    var remaining = Math.max(0, rawAll - rawOct) * (changed ? d2 : d1);
    if (changed && cut) remaining *= 0.92;
    if (changed && !cut) remaining = Math.max(0, remaining - 2);
    var noise = opts.noise === 0 ? 0 : -rng(seed + ':luck')() * 0.03;
    var finalBook = clamp((octBook + remaining) * (1 + noise), octBook, CAP);

    var stage = opts.stage || 'final';
    sepBook *= h2h; octBook *= h2h; finalBook *= h2h;
    var book = stage === 'sep' ? sepBook : stage === 'oct' ? octBook : finalBook;
    var bookings = Math.round(book);

    /* money: first year */
    var rightsCap = Math.round(MAX_RIGHTS * Math.pow(Math.min(1, finalBook / BK), 2));
    var rightsSold = Math.max(0, Math.min(Math.round(Number(dec.rights) || 0), MAX_RIGHTS, rightsCap, bookings));
    var feeAll = cut ? fee2 : fee1;
    var octN = Math.round(octBook);
    var nomRev = (changed && !cut && stage === 'final') ? Math.min(octN, bookings) * fee1 + Math.max(0, bookings - octN) * fee2 : bookings * (stage === 'final' ? feeAll : fee1);
    var feeRight = stage === 'final' ? feeAll : fee1;
    var discLoss = 0;
    if (stage === 'final') discounts.forEach(function (x) { discLoss += x.d * Math.min(x.mares, bookings) * fee2; });
    var rev1 = nomRev + rightsSold * (RIGHT_MULT - 1) * feeRight - discLoss;
    var profit1 = rev1 - D.budget;

    /* years two and three: projected */
    var rq = (0.85 + 0.15 * (0.5 * pl.P + 0.5 * Math.min(1, msgF))) * (changed && cut ? 0.95 : 1) * (fee2 > pl.hi ? 0.9 : 1);
    var ret2 = 0.85 * rq, ret3 = 0.72 * rq, C = rightsCostCurve(colt.A.rights, rightsSold);
    var pay2 = Math.max(0, ret2 * bookings - 0.6 * C), pay3 = Math.max(0, ret3 * bookings - 0.4 * C);
    var y2 = { paying: Math.round(pay2), free: rightsSold * 2, book: Math.round(pay2) + rightsSold * 2, revenue: Math.round(pay2 * fee2) };

  var benchCache = {};

    marketPanel(true)+(done?doneCard(`Your brief is in. Research: ${levelTag((S.levels[p.id]||{}).research)} Be ready to give your owner the 60-second version: who he is, who he is up against, what he is worth, and your early advice.`)+briefPanel(p,true):

function cardFor(p,k){if(!S.assign[p.id]||!(p.apr&&p.apr.farm))return null;const r=resultOf(p,k==='sep'?'sep':'oct');if(!r)return null;
  const rank=k==='nov'?0:(board(k==='sep'?'sep':'oct').findIndex(x=>x.p.id===p.id)+1);return resultCard(p,r,rank)}
function seatCard(p,k){const h=LIVE.full?cardFor(p,k):(RES&&RES.cards&&RES.cards[k]);
  return h||(p.apr&&p.apr.farm?'<div class="card">Your book is being counted on the instructor\'s screen. It will appear here in a moment.</div>':'<div class="card">No launch was submitted for this colt, so there is no book to show.</div>')}
function finalFor(p){if(!LIVE.full)return RES&&RES.final||null;const r=resultOf(p,'final');if(!r)return null;const c=colt(S.assign[p.id]);
  return {head:`${esc(c.name)} finished with ${r.bookings} of ${E.CAP} mares at ${esc(p.apr.farm)}.`,html:report(p,r)}}
let lastRes={};
function writeResults(){if(!LIVE.owner||!LIVE.full||!S)return;
  Object.values(S.players).forEach(p=>{if(p.bot||p.empty)return;
    const out={levels:S.levels[p.id]||{},cards:{},final:null,stage:S.stage};
    ['sep','oct','nov'].forEach((k,i)=>{if(S.stage>=4+i){const h=cardFor(p,k);if(h)out.cards[k]=h}});
    if(S.stage>=7&&S.reveal>=2){const f=finalFor(p);if(f)out.final=f}
    const js=JSON.stringify(out);if(lastRes[p.id]!==js){lastRes[p.id]=js;put('results/'+p.id,out)}});
}

const slotOf=j=>({jan:'research',apr:'pitch',jun:'launch'})[j]||'ev_'+j;

     <ul class="plain" style="margin:10px 0">${p.jun.sp.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small"><b>Why him:</b> ${esc(p.jun.why)}</p>`}

  return `<div class="card" style="background:var(--field)"><div class="row between"><b>${S.hideNames?'Student '+(i+1):esc(p.name)}</b><span class="small muted">${p.bot?'Simulated':''}</span></div>${inner}

   ${j==='jun'?`<label class="small">Comment for their report<input id="note-${p.id}" data-note="${p.id}" value="${esc(lv.note||'')}"></label>`:''}</div>`;

         ${ov&&ov.custom?`<label style="margin-top:8px">Headline<input data-evk="${key}" data-evf="title" value="${esc(ov.title||'')}" placeholder="e.g. Your farm's star stallion has been injured"></label><label style="margin-top:8px">What happened<textarea data-evk="${key}" data-evf="text" rows="3">${esc(ov.text||'')}</textarea></label>`:`<p class="small" style="margin-top:8px">${esc(cur.text)}</p>`}</div>`}).join('')}</div></div>`).join('')}</div></div>`;

function revealView(){
  const pairs=DATA.colts.map(c=>{const pr=Object.values(S.players).filter(p=>S.assign[p.id]===c.id).map(p=>({p,r:resultOf(p,'final')})).filter(x=>x.r).sort((a,b)=>b.r.share1-a.r.share1);return{c,pr}});
  const b1=board('final','share1'),b3=board('final','share3');
  return `<div class="band blue"><div class="stack">
    ${S.reveal>=3&&b3[0]?`<div class="card coral pop" style="text-align:center"><div class="eyebrow">Winner over three years</div><h1 style="margin:8px 0">${esc(b3[0].p.name)}</h1><p>${esc(colt(S.assign[b3[0].p.id]).name)} at ${esc(b3[0].p.apr.farm)} · ${pct(b3[0].r.share3)} of his three-year potential · ${b3[0].r.rightsSold} breeding rights sold</p></div>`:''}
    ${S.reveal>=2&&b1[0]?`<div class="card pop" style="text-align:center"><div class="eyebrow">First-year winner</div><h1 style="margin:8px 0">${esc(b1[0].p.name)}</h1><p>${esc(colt(S.assign[b1[0].p.id]).name)} at ${esc(b1[0].p.apr.farm)} · ${b1[0].r.bookings} mares at ${money(b1[0].r.fee)} · ${pct(b1[0].r.share1)} of his potential</p></div>`:''}
    ${S.reveal>=3?`<div class="card pop"><div class="eyebrow">What each horse is actually worth</div><p class="small" style="margin:6px 0 10px">His value as a stallion: what his first three seasons earn the owner with the best campaign, before his first runners.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Colt</th><th class="r">Valued at</th><th class="r">Actually worth</th><th class="r">Out by</th><th class="r">Their campaign made</th></tr></thead><tbody>${Object.values(S.players).map(p=>({p,r:resultOf(p,'final')})).filter(x=>x.r).sort((a,b)=>Math.abs(((a.p.jan||{}).value||0)/E.benchmark(S.assign[a.p.id]).profit3-1)-Math.abs(((b.p.jan||{}).value||0)/E.benchmark(S.assign[b.p.id]).profit3-1)).map(x=>{const w=E.benchmark(S.assign[x.p.id]).profit3,v=Number((x.p.jan||{}).value)||0;return `<tr><td>${esc(x.p.name)}</td><td>${esc(colt(S.assign[x.p.id]).name)}</td><td class="r">${v?money(v):'none'}</td><td class="r">${money(w)}</td><td class="r">${v?(v>=w?'+':'')+Math.round((v/w-1)*100)+'%':''}</td><td class="r">${money(x.r.profit3)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}
    <h2>Head to head</h2><div class="grid">${pairs.map(x=>`<div class="card" style="background:var(--${coltCol(x.c.id)}-t)"><h3>${esc(x.c.name)}</h3>${x.pr.map((y,i)=>`<div class="row between" style="padding:6px 0;border-top:2px solid var(--ink)"><span>${i===0?'<b>':''}${esc(y.p.name)}${i===0?'</b> <span class="tag ok">Wins</span>':''}</span><span>${y.r.bookings} mares · ${pct(y.r.share1)}</span></div>`).join('')}</div>`).join('')}</div></div></div>`;
}

function render(){
  const app=$('#app'),y=window.scrollY,a=document.activeElement&&document.activeElement.id;
  app.innerHTML=screen();
  if(a){const el=document.getElementById(a);if(el){el.focus();try{if(el.setSelectionRange&&el.type!=='number'){const n=el.value.length;el.setSelectionRange(n,n)}}catch(e){}}}
  growAll();drawQR();window.scrollTo(0,y);tick();
}
function gate(title,text,extra){return `<div class="preview row between"><span><b>The Stallion Game</b></span><span></span></div><div class="band head"><div class="headbox"><div><div class="eyebrow">The Stallion Game</div><h3>${title}</h3></div></div></div><div class="band"><div class="stack" style="max-width:640px"><p class="lead">${text}</p>${extra||''}</div></div>`}
function netBar(){return LIVE.net?`<div class="band tight"><div class="card" role="status" style="background:var(--lemon-t)">${LIVE.net==='auth'?'Your instructor sign-in has expired. Reload the page and sign in again.':'Reconnecting to the game…'}</div></div>`:''}
function screen(){
  if(!LIVE.booted)return gate('Loading','Connecting to the game…');
  if(LIVE.login)return gate('Instructor sign-in','Sign in with the instructor account you added in Supabase.',`<form class="stack" data-act="loginform" style="max-width:360px"><label>Email<input id="lg-email" type="email" autocomplete="username"></label><label>Password<input id="lg-pw" type="password" autocomplete="current-password"></label><div><button class="btn" type="submit">Sign in</button></div>${ui.err?`<span class="tag wait" role="alert">${esc(ui.err)}</span>`:''}</form>`);
  if(LIVE.owner&&LIVE.err==='nosecret')return gate('Game data missing','The benchmarks and scoring data are not in the database. Run the setup script in Supabase again, then reload this page.');
  if(!S&&LIVE.net)return gate('Connecting…','Trying to reach the game. Check your internet connection; this page keeps trying.');
  if(!S)return gate('Waiting for your instructor','The game has not been set up yet. Keep this page open; it will start when your instructor opens the game.');
  if(LIVE.owner)return netBar()+(ui.role==='host'||!P(ui.role)?hostView():studentView(P(ui.role)));
  if(S.pwHash&&(LIVE.pw||lsGet('sg-pw'))!==S.pwHash)return gate('Room password','Type the password your instructor gives you.',`<form class="row" data-act="pwform"><input id="pwin" autocomplete="off" style="max-width:260px" aria-label="Room password"><button class="btn" type="submit">Enter</button></form>${ui.err?`<span class="tag wait" role="alert">${esc(ui.err)}</span>`:''}`);
  if(!LIVE.seat)return gate('Who are you?','Tap your name. Your answers are saved to this seat, so pick carefully.',`<div class="grid small">${DATA.students.map((n,i)=>{const id='p'+i,taken=!!SEATS[id];return `<button class="btn ${taken?'ghost':''}" data-act="seat" data-p="${id}" ${taken?'disabled':''}>${esc(n)}${taken?' · taken':''}</button>`}).join('')}</div>${ui.err?`<span class="tag wait" role="alert">${esc(ui.err)}</span>`:''}<p class="small muted">Someone already in your seat? Ask your instructor to release it.</p>`);

    else if(a==='next'){ui.err='';S.stage=Math.min(7,S.stage+1);S.open=true;S.timerEnd=0;ui.edit=false;ui.jt=null}
    else if(a==='back'){ui.err='';S.stage=Math.max(1,S.stage-1);S.open=true;S.timerEnd=0;S.reveal=0;ui.edit=false;ui.jt=null}
    else if(a==='lock'){S.open=!S.open}
    else if(a==='reveal'){S.reveal=Math.min(3,S.reveal+1);ui.tab='room'}
    else if(a==='names'){S.hideNames=!S.hideNames}
    else if(a==='timer'){S.timerEnd=Date.now()+(Number($('#mins').value)||10)*60000}
    else if(a==='timer0'){S.timerEnd=0}
    else if(a==='sim'){S.sim=t.checked}
    saveState();changed();return}
  else if(a==='level'&&LIVE.owner){const id=t.dataset.p,sl=t.dataset.slot,pl=P(id),L=JUDGE.levels[id]||(JUDGE.levels[id]={}),rv=r=>((pl.rev||{})[SLOT_STAGE[r]]||0);
    L[sl]=t.dataset.l;L['r_'+sl]=rv(sl);if(sl==='ev_oct'&&pl.oct&&pl.oct.rewrite){L.oct=t.dataset.l;L.r_oct=rv('oct')}saveJudge();changed();return}
  else if(a==='release'&&LIVE.owner){delRow('sg_seats',t.dataset.p).then(()=>pollOwner(true)).catch(()=>{});return}
  else if(a==='signout'){AUTH.token=AUTH.refresh=null;authSave();location.reload();return}
  else if(a==='login'){doLogin();return}
  else if(a==='askreset'){ui.confirmReset=true}
  else if(a==='noreset'){ui.confirmReset=false}
  else if(a==='reset'&&LIVE.owner){ui.confirmReset=false;resetGame();return}
  else if(a==='jt'){ui.jt=t.dataset.j}
  else if(a==='h2h'&&LIVE.owner){const L=lvStore(),A=L[t.dataset.a]||(L[t.dataset.a]={}),B=L[t.dataset.b]||(L[t.dataset.b]={}),k='h2h_'+t.dataset.j,w=t.dataset.w;
    A[k]=w==='a'?'won':w==='b'?'lost':'even';B[k]=w==='b'?'won':w==='a'?'lost':'even';lvSaved()}
  else if(a==='evpick'&&LIVE.owner){applyEvPick(t);saveState();changed();return}
  else if(a==='h2h'||a==='evpick'){return}
  else if(a==='edit'){ui.edit=true}
  else if(me){
    const d=getDraft(me,t.dataset.k||k);
    if(a==='state'){d.state=t.dataset.s;d.farm=''}
    else if(a==='farm'){d.farm=t.dataset.n}
    else if(a==='model'){d.model=t.value;if(d.model==='rights'&&!d.rights)d.rights=10}
    else if(a==='buy'){const id=t.dataset.id;d.buys[id]=Math.max(0,(d.buys[id]||0)+Number(t.dataset.d));if(!d.buys[id])delete d.buys[id]}
    else if(a==='rewrite'){d.rewrite=t.checked;if(d.rewrite&&!d.sp){d.sp=me.jun.sp.slice();d.why=me.jun.why}}
    else if(a==='submit'){
      ui.err=validate(me,k,d);if(ui.err){render();return}
      const v=JSON.parse(JSON.stringify(d));
      if(k==='apr'){v.fee=Number(v.fee);v.rights=Math.max(0,Math.min(30,Number(v.rights)||0))}
      if(k==='oct'){v.fee=Number(v.fee)||null;if(v.fee===(me.apr||{}).fee)v.fee=null}
      me[k]=v;me.submitted[k]=true;me.bot=false;ui.edit=false;me.rev=me.rev||{};me.rev[k]=(me.rev[k]||0)+1;
      saveSub(me);delete draft[me.id+':'+k];saveDraft();
    }
  }
  render();

async function sb(path,opt,admin){opt=opt||{};
  if(admin&&AUTH.refresh&&Date.now()>AUTH.exp-120000)await refreshAuth();
  const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});
  if(admin&&AUTH.token)h.Authorization='Bearer '+AUTH.token;
  let r;try{r=await fetch(SB_URL+path,{method:opt.method||'GET',headers:h,body:opt.body==null?undefined:JSON.stringify(opt.body)})}catch(e){throw Object.assign(new Error('network'),{code:'net'})}
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw Object.assign(new Error(m||('HTTP '+r.status)),{code:r.status===401||r.status===403?'auth':r.status>=500?'net':'http',status:r.status})}
  const t=await r.text();return t?JSON.parse(t):null}
